<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnaval de Dunkerque</title>
<style>
/* 3 combinaisons graisse / taille, pas une de plus */
.t1{font:700 28px/1.1 Helvetica,"Helvetica Neue",Arial,sans-serif}
.t2{font:700 16px/1 Helvetica,"Helvetica Neue",Arial,sans-serif;text-transform:uppercase}
.t3{font:400 16px/1.3 Helvetica,"Helvetica Neue",Arial,sans-serif}
html,body{margin:0;height:100%;background:#fff;color:#000;overflow:hidden}
[hidden]{display:none!important}
.b{background:#fff;color:#000;border:1px solid #000;border-radius:0;cursor:pointer;margin:0;padding:20px;letter-spacing:0;text-align:left}
.b:hover:not(:disabled){background:#000;color:#fff}
.b:disabled{opacity:.25;cursor:default}
.row{display:flex;gap:16px}
.row .b{flex:1;text-align:center}

/* accueil : l'affiche au milieu, l'invitation à gauche */
#home{position:fixed;inset:0;display:grid;grid-template-columns:1fr calc((100dvh - 32px) * 9 / 16) 1fr;gap:16px;padding:16px;box-sizing:border-box}
#side{display:flex;align-items:center;justify-content:center}
#join{padding:24px 32px;text-transform:uppercase;white-space:nowrap}
#home.busy #join,#home.busy #done{visibility:hidden}
#done{margin:0}
#pane{position:relative;min-width:0;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#tip{position:fixed;pointer-events:none;background:#000;color:#fff;padding:4px 8px;transform:translate(12px,12px);white-space:nowrap}

/* éditeur : formes à gauche, pantin au milieu, couleurs à droite */
/* formes et couleurs : deux blocs de même taille, chacun centré dans l'espace entre le bord et le pantin.
   5 formes et 5 couleurs, chacune sur une colonne */
#ed{position:fixed;inset:0;background:#fff;display:grid;grid-template-columns:1fr auto 1fr;gap:16px;padding:16px;box-sizing:border-box}
#shapes,#pal{display:grid;gap:8px;align-self:center;justify-self:center;width:152px;height:min(472px,calc(100dvh - 32px))}
#shapes,#pal{grid-template-rows:repeat(5,minmax(0,1fr))}
#mid{display:flex;flex-direction:column;gap:16px;min-height:0;min-width:0}
#pv{flex:1;min-height:0;width:100%;display:block;overflow:visible}
#pv [data-p]{cursor:copy}
#pv g.hot>*{stroke:#000;stroke-width:3px;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
#name{border:1px solid #000;border-radius:0;padding:20px;margin:0;outline:none;background:#fff;color:#000}
#name::placeholder{color:#000;opacity:.4}
.src{min-height:0;overflow:hidden;border:1px solid #000;box-sizing:border-box;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;user-select:none;background:#fff}
.src:hover{background:#000}
.src:hover svg{fill:#fff}
.src svg{height:60%;fill:#000}
#pal .src:hover{outline:3px solid #000;outline-offset:-8px}
.ghost{position:fixed;pointer-events:none;z-index:9;transform:translate(-50%,-50%);margin:0;opacity:.85}

/* confirmation */
#pop{position:fixed;inset:0;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
#pop .box{background:#fff;border:1px solid #000;padding:32px;max-width:520px;display:flex;flex-direction:column;gap:32px}
#msg{margin:0}

/* écran vertical (téléphone, borne) : tout s'empile */
@media (max-aspect-ratio: 1/1){
  #home{grid-template-columns:1fr;grid-template-rows:1fr auto}
  #side{order:2;justify-content:stretch}
  #join{max-width:none;width:100%}
  /* pantin, formes, couleurs, nom, boutons */
  #ed{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto auto auto auto;gap:8px}
  #mid{display:contents}
  #pv{order:1;height:100%}
  #shapes,#pal{width:100%;height:auto;justify-self:stretch}
  #shapes,#pal{grid-template-columns:repeat(5,1fr);grid-template-rows:48px}
  #shapes{order:2}
  #pal{order:3}
  #name{order:4}
  #mid .row{order:5}
}
</style>
</head>
<body>
<main id="home">
  <div id="side">
    <button id="join" class="b t1" hidden>Créer ton personnage</button>
    <p id="done" class="t1" hidden>Ton carnavalier est sur l’affiche.</p>
  </div>
  <div id="pane"><canvas id="cv"></canvas></div>
  <div></div>
</main>
<div id="tip" class="t3" hidden></div>

<section id="ed" hidden>
  <div id="shapes"></div>
  <div id="mid">
    <svg id="pv"></svg>
    <input id="name" class="t3" type="text" maxlength="40" autocomplete="off" spellcheck="false" placeholder="Donne un nom à ton carnavalier">
    <div class="row">
      <button id="gen" class="b t2" disabled>Générer</button>
      <button id="rnd" class="b t2">Aléatoire</button>
    </div>
  </div>
  <div id="pal"></div>
</section>

<div id="pop" hidden>
  <div class="box">
    <p id="msg" class="t1"></p>
    <div class="row">
      <button id="no" class="b t2">Retour</button>
      <button id="yes" class="b t2"></button>
    </div>
  </div>
</div>

<script src="lib/planck.min.js"></script>
<script src="app.js"></script>
</body>
</html>
