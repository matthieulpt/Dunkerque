<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin</title>
<style>
/* mêmes 3 combinaisons graisse / taille que le site, couleurs inversées */
.t1{font:700 28px/1.1 Helvetica,"Helvetica Neue",Arial,sans-serif}
.t2{font:700 16px/1 Helvetica,"Helvetica Neue",Arial,sans-serif;text-transform:uppercase}
.t3{font:400 16px/1.3 Helvetica,"Helvetica Neue",Arial,sans-serif}
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden}
[hidden]{display:none!important}
p,ul{margin:0;padding:0}
.b{background:#000;color:#fff;border:1px solid #fff;border-radius:0;cursor:pointer;margin:0;padding:20px;letter-spacing:0;text-align:left}
.b:hover:not(:disabled){background:#fff;color:#000}
.b:disabled{opacity:.25;cursor:default}
.row{display:flex;gap:16px}
.row .b{flex:1;text-align:center}

/* exports et IP bannies à gauche, l'affiche au milieu, le pantin choisi à droite */
#home{position:fixed;inset:0;display:grid;grid-template-columns:1fr calc((100dvh - 32px) * 9 / 16) 1fr;gap:16px;padding:16px;box-sizing:border-box}
#side,#info{display:flex;flex-direction:column;gap:16px;min-height:0;overflow:auto}
#info{justify-content:center}
#pane{position:relative;min-width:0;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
#bans{list-style:none;display:flex;flex-direction:column;gap:8px}
#bans li{display:flex;align-items:center;justify-content:space-between;gap:16px;word-break:break-all}
#bans .b{padding:8px 12px;flex:none}

/* confirmation */
#pop{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
#pop .box{background:#000;border:1px solid #fff;padding:32px;max-width:520px;display:flex;flex-direction:column;gap:32px}
#msg{word-break:break-word}
</style>
</head>
<body>
<main id="home">
  <div id="side">
    <div class="row">
      <button id="pdf" class="b t2">PDF</button>
      <button id="jpg" class="b t2">JPG</button>
      <button id="svg" class="b t2">SVG</button>
    </div>
    <p class="t2">IP bannies</p>
    <ul id="bans" class="t3"></ul>
  </div>
  <div id="pane"><canvas id="cv"></canvas></div>
  <aside id="info" hidden>
    <p id="iname" class="t1"></p>
    <p class="t3"><span id="iip"></span><br><span id="imode"></span><br><span id="idate"></span></p>
    <button id="del" class="b t2">Supprimer</button>
    <button id="ban" class="b t2">Supprimer et bannir l’IP</button>
  </aside>
</main>

<div id="pop" hidden>
  <div class="box">
    <p id="msg" class="t1"></p>
    <div class="row">
      <button id="no" class="b t2">Retour</button>
      <button id="yes" class="b t2"></button>
    </div>
  </div>
</div>

<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/svg2pdf.umd.min.js"></script>
<script src="admin.js"></script>
</body>
</html>
